name: 生成 LX Music iOS 14 未签名 IPA（v4 修复合集）

# 适用仓库：javaeryang/lx-music-mobile 的 ios-adaptation 分支（v1.9.1 / RN 0.73.11）
# 用法：fork 该仓库 -> 把本文件放到 .github/workflows/ 下 -> Actions 手动 Run workflow
#
# 全程免费：Public 仓库 + GitHub 托管的 macOS 标准 runner（公开仓库不限量）
# 不需要 Apple 开发者账号、证书、Secrets，也不需要 Mac。
# 产物是【未签名】IPA，需自行签名后安装。
#
# 相对社区原版 ios-pack.yml 的改动：
#   1. 强制 iOS 14.0 部署目标（改 Podfile 平台行 + pbxproj，并在构建后校验 MinimumOSVersion）
#   2. 只保留手动触发，避免每次 push 消耗构建时间
#   3. 修掉 macOS 上不存在的 md5sum（改用 md5 -q）
#   4. iOS runtime 准备失败降级为警告，不直接掐断 archive
#   5. 构建产物名带 ios14 标识，便于和原版区分
#
#   6. 修复「本地导入」无反应：iOS 上 AndroidScoped.openDocument 不存在，
#      selectFile() 直接 return null，调用方静默 return，界面什么都不弹。
#      改为系统 UIDocumentPickerViewController（引入
#      react-native-document-picker@9.1.0，iOS 11+ / 纯 ObjC）。
#   7.【v2 新增】修复「连续导入两个音源后界面假死」：
#      selectFile 增加防重入；ChoosePath 失败降级在 iOS 上不再打开
#      bgHide=false 的内置文件浏览器 Modal；ScriptImportExport 每次导入
#      重新挂载 ChoosePath 并延后到下拉菜单 Modal dismiss 之后再弹出。
#   8.【v2 新增】修复自定义音源（小秋音乐等）搜索「加载失败」：
#      Info.plist 原 NSAllowsArbitraryLoads=false，仅对 6 个内置音源域名
#      放行 HTTP，自定义音源接口域名会被 ATS 拦截；这里置为 true。
#      原 setup action 的 npm ci 会因 lock 不一致失败，故改用 npm install。
#   9.【v3 新增】修复通知中心 / 控制中心 / 锁屏不显示歌词：
#      根因是 onLyricLinePlay 依赖 Android 的 LyricModule 原生模块，
#      iOS 上该模块不存在、事件永不触发，updateRemoteLyric 从不调用。
#      与 iOS 版本 / Live Activities 无关（不需要 iOS 16.1）。
#      v3 在 iOS 上改用 JS 层驱动器解析 LRC 并按进度逐行更新，
#      把当前歌词写进 MPMediaItemPropertyAlbumTitle（控制中心
#      「歌手 — 专辑」副标题行，长文本由系统跑马灯滚动）。
#      同时把「显示蓝牙歌词」开关默认改为 true 并更新中文文案。
#  10.【v4 新增】修复「拖拽进度条后歌词不随播放时间跳转」：
#      Progress.tsx 拖拽结束发 global.app_event.setProgress(time)（秒），
#      playProgress.ts 只做 seekTo + 更新进度数字，从未通知歌词播放器；
#      应用内歌词由 lrcTools.lrc.play(time) 按绝对时间驱动，seek 后
#      时间轴不重置，歌词停在原行。v4 在 core/init/player/lyric.ts 监听
#      setProgress，用目标时间调用 handlePlay(time * 1000) 重新定位，
#      同时把它注入 iOS 通知中心歌词驱动器，立即按目标时间刷新。
#      覆盖：拖进度条 / 点歌词行 / 锁屏 RemoteSeek / 恢复播放位置。
#
# 注意：本文件是「构建时注入」补丁，不改动你仓库里的源码文件；
#       若想在仓库里正式提交修复，见随附的 lx-music-patches-v4.zip。

on:
  workflow_dispatch:

jobs:
  build:
    name: iOS 14 unsigned IPA
    # macOS 14 镜像已于 2026-11-02 退役；macos-15 仍带 Xcode 16.0~16.4。
    runs-on: macos-15
    timeout-minutes: 150

    steps:
      - name: 检出代码（含仓库内 .github/actions/setup）
        uses: actions/checkout@v4

      # RN 0.73 官方支持到 Xcode 15；Xcode 16.3+ (clang 17) 会破坏 RCT-Folly/boost，
      # 因此优先选 16.2 / 16.1 / 16.0，都不在则用镜像默认并给出警告。
      - name: 锁定兼容的 Xcode
        run: |
          XCODE=''
          for v in 16.2 16.1 16.0; do
            if [ -d "/Applications/Xcode_${v}.app" ]; then
              XCODE="/Applications/Xcode_${v}.app"
              break
            fi
          done
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "$XCODE"
            echo "使用 $XCODE"
          else
            echo '::warning::未找到 Xcode 16.0~16.2，改用镜像默认；RN 0.73 可能编译失败'
          fi
          xcodebuild -version

      - name: 初始化 Xcode
        run: sudo xcodebuild -runFirstLaunch

      - name: 准备 iOS 平台 runtime（ibtool 编译 storyboard 需要）
        timeout-minutes: 30
        run: |
          for attempt in 1 2 3; do
            echo "准备 iOS runtime（第 ${attempt}/3 次）"
            if xcrun simctl list > /dev/null && xcodebuild -downloadPlatform iOS; then
              xcrun --sdk iphoneos --show-sdk-version
              exit 0
            fi
            [ "$attempt" -lt 3 ] && sleep 10
          done
          echo '::warning::iOS runtime 准备失败，继续尝试 archive（若 ibtool 报错再看日志）'
          xcode-select -p
          xcodebuild -version

      # ---------- 关键：把部署目标钉死在 iOS 14.0 ----------
      # RN 0.73 的 min_ios_version_supported 是 13.4，Podfile 默认跟随；
      # 这里改成 14.0，同时把工程里 Debug/Release/Test 的部署目标统一覆盖。
      # 若某个 pod 的 podspec 声明了高于 14.0 的下限，pod install 会直接报错，
      # 那就说明 iOS 14 在当前依赖组合下不可行，需要降级该依赖。
      - name: 强制 iOS 14 部署目标
        run: |
          set -euo pipefail
          sed -i '' "s/^platform :ios, min_ios_version_supported$/platform :ios, '14.0'/" ios/Podfile
          sed -i '' -E 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9][0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/g' \
            ios/LxMusicMobile.xcodeproj/project.pbxproj
          echo '--- Podfile 平台行 ---'
          grep -n '^platform :ios' ios/Podfile || true
          echo '--- pbxproj 部署目标 ---'
          grep -n 'IPHONEOS_DEPLOYMENT_TARGET' ios/LxMusicMobile.xcodeproj/project.pbxproj || true

      # 原仓库 ./.github/actions/setup 用的是 `npm ci`，会因新增依赖与
      # package-lock.json 不一致而失败；这里改成「注入修复 + npm install」。
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: 缓存 npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: 注入 v4 修复（进度条歌词跳转 / 通知中心歌词 / 导入 / 自定义源）并安装依赖
        run: |
          set -euo pipefail
          echo '' | python3 -c "import base64,sys;sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))" > /tmp/ios_picker_patch.py
          python3 /tmp/ios_picker_patch.py

          # 放开 ATS：原 Info.plist 的 NSAllowsArbitraryLoads=false，只对
          # kugou/kuwo/163/migu/qq/stsky 六个域名放行 HTTP；自定义音源
          # （小秋音乐等）的接口域名不在白名单内会被 iOS 直接拦截。
          PLIST='ios/LxMusicMobile/Info.plist'
          if ! /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" "$PLIST" 2>/dev/null; then
            python3 -c "import plistlib; p='$PLIST'; d=plistlib.load(open(p,'rb')); d.setdefault('NSAppTransportSecurity',{})['NSAllowsArbitraryLoads']=True; plistlib.dump(d,open(p,'wb'))"
          fi
          python3 -c "import plistlib; d=plistlib.load(open('$PLIST','rb')); assert d['NSAppTransportSecurity']['NSAllowsArbitraryLoads'] is True; print('ATS 已放开: NSAllowsArbitraryLoads = True')"

          npm install --no-audit --no-fund
          test -d node_modules/react-native-document-picker
          grep -q 'react-native-document-picker' src/utils/fs.ts
          grep -q 'selectFileInFlight' src/utils/fs.ts
          grep -q "Platform.OS === 'ios'" src/components/common/ChoosePath/index.tsx
          grep -q 'startIOSLyricDriver' src/core/init/player/lyric.ts
          grep -q 'forcedPosition' src/core/init/player/lyric.ts
          grep -qF "global.app_event.on('setProgress'" src/core/init/player/lyric.ts
          grep -qF 'handlePlay(time * 1000)' src/core/init/player/lyric.ts
          grep -q 'album: lrc' src/core/init/player/lyric.ts
          grep -q "'player.isShowBluetoothLyric': true" src/config/defaultSetting.ts
          grep -q '显示通知中心/锁屏滚动歌词' src/lang/zh-cn.json
          echo '--- 文档选择器依赖版本 ---'
          node -p "require('./node_modules/react-native-document-picker/package.json').version"

      - name: 读取版本号
        run: echo "PACKAGE_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: 缓存 CocoaPods
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-ios14-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: 安装 Pods
        env:
          NO_FLIPPER: '1'
        run: |
          bundle config set --local path vendor/bundle
          bundle install
          bundle exec pod install --project-directory=ios
          echo '--- 确认文档选择器 pod 已被 autolink ---'
          grep -i 'react-native-document-picker' ios/Podfile.lock || {
            echo '::error::react-native-document-picker 未被 CocoaPods 链接，本地导入仍会失效'
            exit 1
          }

      - name: 编译未签名 App
        run: |
          cd ios
          xcodebuild \
            -workspace LxMusicMobile.xcworkspace \
            -scheme LxMusicMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=14.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: 校验产物最低系统版本确实是 14.0
        run: |
          APP="ios/build/Build/Products/Release-iphoneos/LxMusicMobile.app"
          echo -n "MinimumOSVersion = "
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist"
          echo -n "签名状态："
          codesign -dv "$APP" 2>&1 || true

      - name: 打包未签名 IPA
        run: |
          set -euo pipefail
          cd ios/build/Build/Products/Release-iphoneos
          rm -rf Payload && mkdir Payload
          cp -R LxMusicMobile.app Payload/
          ditto -c -k --keepParent Payload \
            "${GITHUB_WORKSPACE}/lx-music-mobile-v${PACKAGE_VERSION}-ios14-unsigned.ipa"
          cd "${GITHUB_WORKSPACE}"
          rm -rf ios/build/Build/Products/Release-iphoneos/Payload
          md5 -q "lx-music-mobile-v${PACKAGE_VERSION}-ios14-unsigned.ipa"
          ls -lh "lx-music-mobile-v${PACKAGE_VERSION}-ios14-unsigned.ipa"

      - name: 上传 artifact（免费）
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-v${{ env.PACKAGE_VERSION }}-ios14-unsigned
          path: lx-music-mobile-v${{ env.PACKAGE_VERSION }}-ios14-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
